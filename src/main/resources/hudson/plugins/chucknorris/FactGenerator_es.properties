fact.33=Ninguna instrucci\u00f3n puede capturar la ChuckNorrisException.
fact.34=Chuck Norris no programa con teclado. Le sostiene la mirada al ordenador hasta que hace lo que \u00e9l quiere.
fact.35=Chuck Norris no hace programaci\u00f3n en pareja.
fact.36=Chuck Norris puede escribir aplicaciones multihilo con un solo hilo.
fact.37=No hay tecla Esc en el teclado de Chuck Norris, porque nadie escapa de Chuck Norris.
