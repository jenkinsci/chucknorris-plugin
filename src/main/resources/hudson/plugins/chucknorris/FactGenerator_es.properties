fact.66=Los m\u00e9todos an\u00f3nimos y los tipos an\u00f3nimos en realidad se llaman todos Chuck Norris. Simplemente no les gusta presumir.
fact.67=Chuck Norris no tiene cuellos de botella de rendimiento. Simplemente hace que el universo espere su turno.
fact.68=Chuck Norris no usa excepciones al programar. No ha sido capaz de encontrar ni una parte de su c\u00f3digo que no sea excepcional.
fact.69=Cuando el c\u00f3digo de Chuck Norris no compila, el compilador pide perd\u00f3n.
fact.70=Chuck Norris no usa control de versiones. El c\u00f3digo de Chuck Norris nunca ha necesitado una revisi\u00f3n.
