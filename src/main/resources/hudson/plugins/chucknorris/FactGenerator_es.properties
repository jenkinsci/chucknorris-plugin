fact.28=Chuck Norris no recibe errores de compilaci\u00f3n, el lenguaje cambia para adaptarse a Chuck Norris.
fact.29=Los programas que escribe Chuck Norris no tienen n\u00famero de versi\u00f3n, porque solo los escribe una vez. Si un usuario informa de un bug o pide una funcionalidad, no vive para ver la puesta de sol.
fact.30=Chuck Norris no cree en los n\u00fameros de coma flotante, porque no se pueden escribir en su teclado binario.
