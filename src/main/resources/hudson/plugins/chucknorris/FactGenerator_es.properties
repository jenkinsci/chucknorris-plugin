fact.48=Los protocolos que dise\u00f1a Chuck Norris no tienen estados, peticiones ni respuestas, solo \u00f3rdenes.
fact.49=Los programas de Chuck Norris ocupan el 150 % de la CPU, incluso cuando no se est\u00e1n ejecutando.
