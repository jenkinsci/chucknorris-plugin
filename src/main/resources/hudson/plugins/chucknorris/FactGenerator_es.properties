fact.0=Todos los arrays que declara Chuck Norris son de tama\u00f1o infinito, porque Chuck Norris no conoce l\u00edmites.
fact.1=Chuck Norris no tiene latencia de disco, porque el disco duro sabe que m\u00e1s le vale darse prisa.
