fact.fallback=Chuck Norris consegue dividir por zero.
fact.0=Todos os arrays declarados por Chuck Norris t\u00EAm tamanho infinito, porque Chuck Norris n\u00E3o conhece limites.
fact.1=Chuck Norris n\u00E3o sofre com lat\u00EAncia de disco porque o disco r\u00EDgido sabe que precisa ser r\u00E1pido.
fact.2=Todos os navegadores suportam as defini\u00E7\u00F5es hexadecimais #chuck e #norris para as cores preto e azul.
fact.3=Chuck Norris n\u00E3o pode testar igualdade porque n\u00E3o tem iguais.
fact.4=Chuck Norris n\u00E3o precisa de garbage collection porque n\u00E3o chama .Dispose(), chama .DropKick().
fact.5=O primeiro programa de Chuck Norris foi kill -9.
fact.6=Chuck Norris estourou a bolha das empresas pontocom.
fact.7=Chuck Norris escreve c\u00F3digo que se otimiza sozinho.
fact.8=Chuck Norris consegue escrever fun\u00E7\u00F5es recursivas infinitas... e faz\u00EA-las retornar.
fact.9=Chuck Norris consegue resolver as Torres de Han\u00F3i em um \u00FAnico movimento.
fact.10=O \u00FAnico padr\u00E3o de projeto que Chuck Norris conhece \u00E9 God Object.
fact.11=Chuck Norris zerou World of Warcraft.
fact.12=Gerentes de projeto nunca pedem estimativas a Chuck Norris... nunca.
fact.13=Chuck Norris n\u00E3o segue os padr\u00F5es da web porque a web se adapta a ele.
fact.14="Funciona na minha m\u00E1quina" \u00E9 sempre verdade para Chuck Norris.
fact.15=Os quadros-negros s\u00E3o brancos porque Chuck Norris os assustou.
fact.16=A barba de Chuck Norris consegue digitar 140 palavras por minuto.
fact.17=Chuck Norris consegue testar uma aplica\u00E7\u00E3o inteira com um \u00FAnico assert.
fact.18=Chuck Norris n\u00E3o ca\u00E7a bugs, porque isso implicaria a possibilidade de falhar. Ele simplesmente os elimina.
fact.19=O teclado de Chuck Norris n\u00E3o tem a tecla Ctrl porque nada controla Chuck Norris.
fact.20=Chuck Norris n\u00E3o precisa de um debugger. Ele encara o bug at\u00E9 que o c\u00F3digo confesse.
fact.21=Chuck Norris consegue acessar m\u00E9todos privados.
fact.22=Chuck Norris consegue instanciar uma classe abstrata.
fact.23=Chuck Norris n\u00E3o precisa conhecer o padr\u00E3o Factory. Ele consegue instanciar interfaces.
fact.24=A classe Object herda de Chuck Norris.
fact.25=Para Chuck Norris, NP-Hard = O(1).
fact.26=Chuck Norris conhece o \u00FAltimo d\u00EDgito de PI.
fact.27=Chuck Norris consegue dividir por zero.
fact.28=Chuck Norris n\u00E3o recebe erros de compila\u00E7\u00E3o. A linguagem se modifica sozinha para se adaptar a ele.
fact.29=Os programas escritos por Chuck Norris n\u00E3o t\u00EAm n\u00FAmeros de vers\u00E3o porque ele os escreve apenas uma vez. Se um usu\u00E1rio reporta um bug ou solicita uma funcionalidade, n\u00E3o sobrevive at\u00E9 o anoitecer.
fact.30=Chuck Norris n\u00E3o acredita em n\u00FAmeros de ponto flutuante porque eles n\u00E3o podem ser digitados em seu teclado bin\u00E1rio.
fact.31=Chuck Norris resolveu o problema do caixeiro-viajante em tempo O(1).
fact.32=Chuck Norris nunca recebe erros de sintaxe. Em vez disso, a linguagem recebe um erro DoesNotConformToChuck.
fact.33=Nenhuma instru\u00E7\u00E3o consegue capturar a ChuckNorrisException.
fact.34=Chuck Norris n\u00E3o programa usando um teclado. Ele encara o computador at\u00E9 que ele fa\u00E7a o que deseja.
fact.35=Chuck Norris n\u00E3o faz programa\u00E7\u00E3o em dupla.
fact.36=Chuck Norris consegue escrever aplica\u00E7\u00F5es multithread usando uma \u00FAnica thread.
fact.37=O teclado de Chuck Norris n\u00E3o tem a tecla Esc porque ningu\u00E9m escapa de Chuck Norris.
fact.38=Chuck Norris n\u00E3o exclui arquivos, ele os aniquila.
fact.39=Chuck Norris consegue realizar uma busca bin\u00E1ria em dados n\u00E3o ordenados.
fact.40=Chuck Norris decifra c\u00F3digos RSA de 128 bits em milissegundos.
fact.41=Chuck Norris saiu de um loop infinito.
fact.42=Chuck Norris consegue ler todos os dados criptografados porque nada consegue se esconder dele.
fact.43=A hospedagem de Chuck Norris garante 101% de disponibilidade.
fact.44=Quando um bug v\u00EA Chuck Norris, foge gritando de terror e se autodestr\u00F3i para evitar um chute girat\u00F3rio.
fact.45=Chuck Norris reescreveu o mecanismo de busca do Google do zero.
fact.46=Chuck Norris n\u00E3o precisa da nuvem para escalar suas aplica\u00E7\u00F5es. Ele usa seu notebook.
fact.47=Chuck Norris consegue acessar o banco de dados diretamente pela interface de usu\u00E1rio.
fact.48=O protocolo de Chuck Norris n\u00E3o possui estados, requisi\u00E7\u00F5es ou respostas, apenas comandos.
fact.49=Os programas de Chuck Norris utilizam 150% da CPU, mesmo quando n\u00E3o est\u00E3o em execu\u00E7\u00E3o.
fact.50=Chuck Norris consegue criar threads que terminam antes mesmo de serem iniciadas.
fact.51=Os programas de Chuck Norris n\u00E3o aceitam entradas.
fact.52=Chuck Norris n\u00E3o precisa de um sistema operacional.
fact.53=Chuck Norris consegue compilar erros de sintaxe.
fact.54=Chuck Norris compacta seus arquivos com um chute girat\u00F3rio no disco r\u00EDgido.
fact.55=Chuck Norris n\u00E3o usa computadores porque eles fazem tudo mais lentamente do que ele.
fact.56=Voc\u00EA n\u00E3o desativa o plugin do Chuck Norris. \u00C9 ele quem desativa voc\u00EA.
fact.57=Chuck Norris n\u00E3o precisa de um compilador Java. Ele vai diretamente para o arquivo .war.
fact.58=Chuck Norris pode usar GOTO \u00E0 vontade. Dizer o contr\u00E1rio \u00E9 considerado perigoso.
fact.59=Nada \u00E9 regular nas express\u00F5es regulares de Chuck Norris.
fact.60=A criptografia qu\u00E2ntica n\u00E3o funciona com Chuck Norris. Quando algo \u00E9 observado por Chuck, permanece no mesmo estado at\u00E9 que ele termine.
fact.61=N\u00E3o adianta tentar capturar as exce\u00E7\u00F5es de Chuck Norris. Cada exce\u00E7\u00E3o que ele lan\u00E7a \u00E9 fatal.
fact.62=A barba de Chuck Norris \u00E9 imut\u00E1vel.
fact.63=O IDE favorito de Chuck Norris \u00E9 o hexedit.
fact.64=Chuck Norris \u00E9 imut\u00E1vel. Se algo precisa mudar, o resto do universo ter\u00E1 que mudar.
fact.65=O operador de adi\u00E7\u00E3o de Chuck Norris n\u00E3o \u00E9 comutativo. Ele se teletransporta para onde Chuck Norris precisar.
fact.66=Todos os m\u00E9todos an\u00F4nimos e tipos an\u00F4nimos se chamam Chuck Norris. Eles simplesmente n\u00E3o gostam de se gabar.
fact.67=Chuck Norris n\u00E3o tem gargalos de desempenho. Ele simplesmente faz o universo esperar pela sua vez.
fact.68=Chuck Norris n\u00E3o usa exce\u00E7\u00F5es ao programar. Ele nunca encontrou nenhuma parte de seu c\u00F3digo que n\u00E3o fosse excepcional.
fact.69=Quando o c\u00F3digo de Chuck Norris n\u00E3o compila, o compilador pede desculpas.
fact.70=Chuck Norris n\u00E3o usa sistemas de controle de vers\u00E3o. Nenhum de seus c\u00F3digos jamais precisou de revis\u00E3o.
fact.71=Chuck Norris consegue recitar o n\u00FAmero pi de tr\u00E1s para frente.
fact.72=Quando Chuck Norris aponta para null, null treme de medo.
fact.73=Chuck Norris tem acesso root ao seu sistema.
fact.74=Quando Chuck Norris passa um argumento para um m\u00E9todo, o m\u00E9todo perde.
fact.75=O teclado de Chuck Norris n\u00E3o tem a tecla F1. \u00C9 o computador que pede ajuda a ele.
fact.76=Chuck Norris \u00E9 dur\u00E3o demais para soft deletes.
fact.77=Chuck Norris n\u00E3o cria gr\u00E1ficos Burn Down, cria gr\u00E1ficos Smack Down.
fact.78=Chuck Norris consegue excluir a Lixeira.
fact.79=Quando Chuck Norris pressiona Ctrl+Alt+Delete, todos os computadores do mundo come\u00E7am a reiniciar.
fact.80=Quando Chuck Norris lan\u00E7a exce\u00E7\u00F5es, ele as arremessa pela sala.
fact.81=Quando Chuck Norris navega na internet, os sites recebem a mensagem "Aten\u00E7\u00E3o: o Internet Explorer determinou que este usu\u00E1rio \u00E9 perigoso. Deseja continuar?".
fact.82=Chuck Norris n\u00E3o faz merge de branches. O Git se curva e executa um fast-forward atrav\u00E9s do espa\u00E7o e do tempo.
fact.83=Chuck Norris consegue desreferenciar um ponteiro null e encontrar dados reais.
fact.84=Chuck Norris n\u00E3o faz deploy em produ\u00E7\u00E3o. \u00C9 a produ\u00E7\u00E3o que migra at\u00E9 ele.
fact.85=Chuck Norris consegue causar overflow em uma tabela hash sem nenhuma colis\u00E3o.
fact.86=Quando Chuck Norris executa sudo, o usu\u00E1rio root pede permiss\u00E3o a ele primeiro.
fact.87=Chuck Norris n\u00E3o precisa de DNS. Os endere\u00E7os IP \u00E9 que armazenam o nome de dom\u00EDnio dele.
fact.88=Chuck Norris consegue escrever um programa em HTML e torn\u00E1-lo Turing completo.
fact.89=Os deadlocks se resolvem sozinhos assim que Chuck Norris entra no thread pool.
fact.90=Chuck Norris n\u00E3o usa mocks para suas depend\u00EAncias. As depend\u00EAncias t\u00EAm medo genu\u00EDno dele.
fact.91=O ping de Chuck Norris \u00E9 negativo. O pacote chega antes mesmo de ele transmiti-lo.
fact.92=Chuck Norris n\u00E3o envia prompts para LLMs. S\u00E3o os LLMs que pedem contexto a Chuck Norris.
fact.93=A rede neural de Chuck Norris converge na \u00E9poca 0 com 100% de precis\u00E3o nos testes.
fact.94=Chuck Norris n\u00E3o treina modelos de IA em GPUs. Ele lan\u00E7a um olhar severo para os pesos e eles se alinham sozinhos.
fact.95=Modelos de IA nunca alucinam quando conversam com Chuck Norris. Eles n\u00E3o ousariam mentir na cara dele.
fact.96=Chuck Norris passou no teste de Turing antes mesmo de Alan Turing nascer.
fact.97=Chuck Norris n\u00E3o usa RAG. Todo o conhecimento externo tem medo de sair da cabe\u00E7a dele.
fact.98=A janela de contexto de Chuck Norris n\u00E3o tem limite de tokens porque o universo funciona com a RAM dele.
fact.99=A Intelig\u00EAncia Artificial Geral n\u00E3o foi inventada. Ela se tornou autoconsciente tentando escapar de Chuck Norris.
fact.100=Chuck Norris consegue executar o gradiente descendente em uma \u00FAnica etapa com loss zero.
fact.101=Quando Chuck Norris insere um prompt, a temperatura cai automaticamente abaixo do zero absoluto.
