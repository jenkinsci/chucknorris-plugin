# Chuck Norris programmer facts (French)
fact.count=102
# Shown when a stored fact index no longer exists (same text as fact.27).
fact.fallback=Chuck Norris peut diviser par z\u00e9ro.
fact.0=Tous les tableaux que Chuck Norris d\u00e9clare sont de taille infinie, car Chuck Norris ne conna\u00eet aucune limite.
fact.1=Chuck Norris n'a pas de latence disque, car le disque dur sait qu'il a int\u00e9r\u00eat \u00e0 se d\u00e9p\u00eacher.
fact.2=Tous les navigateurs reconnaissent les codes hexad\u00e9cimaux #chuck et #norris pour les couleurs noir et bleu.
fact.3=Chuck Norris ne peut pas tester l'\u00e9galit\u00e9, car il n'a pas d'\u00e9gal.
fact.4=Chuck Norris n'a pas besoin de ramasse-miettes, car il n'appelle pas .Dispose(), il appelle .DropKick().
fact.5=Le premier programme de Chuck Norris \u00e9tait kill -9.
fact.6=C'est Chuck Norris qui a fait \u00e9clater la bulle Internet.
fact.7=Chuck Norris \u00e9crit du code qui s'optimise tout seul.
fact.8=Chuck Norris peut \u00e9crire des fonctions \u00e0 r\u00e9cursion infinie... et elles retournent quand m\u00eame.
fact.9=Chuck Norris r\u00e9sout les tours de Hano\u00ef en un seul coup.
fact.10=Le seul patron de conception que conna\u00eet Chuck Norris est le God Object.
fact.11=Chuck Norris a termin\u00e9 World of Warcraft.
fact.12=Les chefs de projet ne demandent jamais d'estimations \u00e0 Chuck Norris... jamais.
fact.13=Chuck Norris n'utilise pas les standards du Web, car c'est le Web qui se conforme \u00e0 lui.
fact.14=\u00ab \u00c7a marche sur ma machine \u00bb est toujours vrai pour Chuck Norris.
fact.15=Les tableaux blancs sont blancs parce que Chuck Norris les a fait bl\u00eamir de peur.
fact.16=La barbe de Chuck Norris tape 140 mots par minute.
fact.17=Chuck Norris peut tester unitairement une application enti\u00e8re avec un seul assert.
fact.18=Chuck Norris ne chasse pas les bugs, car chasser implique une probabilit\u00e9 d'\u00e9chec. Il les abat.
fact.19=Le clavier de Chuck Norris n'a pas de touche Ctrl, car rien ne contr\u00f4le Chuck Norris.
fact.20=Chuck Norris n'a pas besoin de d\u00e9bogueur, il fixe le bug du regard jusqu'\u00e0 ce que le code avoue.
fact.21=Chuck Norris peut acc\u00e9der aux m\u00e9thodes priv\u00e9es.
fact.22=Chuck Norris peut instancier une classe abstraite.
fact.23=Chuck Norris n'a pas besoin de conna\u00eetre le patron Factory. Il peut instancier des interfaces.
fact.24=La classe Object h\u00e9rite de Chuck Norris.
fact.25=Pour Chuck Norris, NP-Hard = O(1).
fact.26=Chuck Norris conna\u00eet la derni\u00e8re d\u00e9cimale de PI.
fact.27=Chuck Norris peut diviser par z\u00e9ro.
fact.28=Chuck Norris n'a jamais d'erreurs de compilation, c'est le langage qui s'adapte \u00e0 Chuck Norris.
fact.29=Les programmes de Chuck Norris n'ont pas de num\u00e9ro de version, car il ne les \u00e9crit qu'une seule fois. Si un utilisateur signale un bug ou demande une fonctionnalit\u00e9, il ne vivra pas assez longtemps pour voir le coucher du soleil.
fact.30=Chuck Norris ne croit pas aux nombres \u00e0 virgule flottante, car on ne peut pas les taper sur son clavier binaire.
fact.31=Chuck Norris a r\u00e9solu le probl\u00e8me du voyageur de commerce en temps O(1).
fact.32=Chuck Norris n'a jamais d'erreur de syntaxe. C'est le langage qui re\u00e7oit une erreur DoesNotConformToChuck.
fact.33=Aucune instruction ne peut attraper la ChuckNorrisException.
fact.34=Chuck Norris ne programme pas avec un clavier. Il fixe l'ordinateur du regard jusqu'\u00e0 ce qu'il ob\u00e9isse.
fact.35=Chuck Norris ne fait pas de programmation en bin\u00f4me.
fact.36=Chuck Norris peut \u00e9crire des applications multithread avec un seul thread.
fact.37=Il n'y a pas de touche \u00c9chap sur le clavier de Chuck Norris, car personne n'\u00e9chappe \u00e0 Chuck Norris.
fact.38=Chuck Norris ne supprime pas les fichiers, il les pulv\u00e9rise.
fact.39=Chuck Norris peut faire une recherche dichotomique sur des donn\u00e9es non tri\u00e9es.
fact.40=Chuck Norris casse les codes chiffr\u00e9s en RSA 128 bits en quelques millisecondes.
fact.41=Chuck Norris est sorti d'une boucle infinie.
fact.42=Chuck Norris peut lire toutes les donn\u00e9es chiffr\u00e9es, car rien ne peut se cacher de Chuck Norris.
fact.43=L'h\u00e9bergement de Chuck Norris garantit une disponibilit\u00e9 de 101 %.
fact.44=Quand un bug voit Chuck Norris, il s'enfuit en hurlant de terreur, puis s'autod\u00e9truit aussit\u00f4t pour \u00e9viter un coup de pied circulaire.
fact.45=Chuck Norris a r\u00e9\u00e9crit le moteur de recherche Google \u00e0 partir de z\u00e9ro.
fact.46=Chuck Norris n'a pas besoin du cloud pour passer ses applications \u00e0 l'\u00e9chelle, il utilise son ordinateur portable.
fact.47=Chuck Norris peut acc\u00e9der \u00e0 la base de donn\u00e9es depuis l'interface utilisateur.
fact.48=Les protocoles con\u00e7us par Chuck Norris n'ont ni statuts, ni requ\u00eates, ni r\u00e9ponses, seulement des ordres.
fact.49=Les programmes de Chuck Norris occupent 150 % du CPU, m\u00eame quand ils ne s'ex\u00e9cutent pas.
fact.50=Chuck Norris peut lancer des threads qui se terminent avant d'avoir d\u00e9marr\u00e9.
fact.51=Les programmes de Chuck Norris n'acceptent aucune donn\u00e9e en entr\u00e9e.
fact.52=Chuck Norris n'a pas besoin de syst\u00e8me d'exploitation.
fact.53=Chuck Norris sait compiler des erreurs de syntaxe.
fact.54=Chuck Norris compresse ses fichiers en donnant un coup de pied circulaire saut\u00e9 au disque dur.
fact.55=Chuck Norris n'utilise pas d'ordinateur, car un ordinateur fait tout plus lentement que Chuck Norris.
fact.56=On ne d\u00e9sactive pas le plug-in Chuck Norris, c'est lui qui vous d\u00e9sactive.
fact.57=Chuck Norris n'a pas besoin de compilateur Java, il part directement en .war
fact.58=Chuck Norris peut utiliser GOTO autant qu'il le veut. Lui dire le contraire est consid\u00e9r\u00e9 comme nuisible.
fact.59=Les expressions de Chuck Norris n'ont rien de r\u00e9gulier.
fact.60=La cryptographie quantique ne fonctionne pas sur Chuck Norris. Quand Chuck observe quelque chose, cela reste dans le m\u00eame \u00e9tat jusqu'\u00e0 ce qu'il ait fini.
fact.61=Inutile d'essayer d'attraper les exceptions de Chuck Norris pour s'en remettre : chaque exception qu'il lance est fatale.
fact.62=La barbe de Chuck Norris est immuable.
fact.63=L'IDE pr\u00e9f\u00e9r\u00e9 de Chuck Norris est hexedit.
fact.64=Chuck Norris est immuable. Si quelque chose doit changer, ce sera le reste de l'univers.
fact.65=L'op\u00e9rateur d'addition de Chuck Norris n'est pas commutatif ; il se t\u00e9l\u00e9porte l\u00e0 o\u00f9 il en a besoin.
fact.66=Les m\u00e9thodes anonymes et les types anonymes s'appellent tous en r\u00e9alit\u00e9 Chuck Norris. Ils n'aiment simplement pas se vanter.
fact.67=Chuck Norris n'a pas de goulots d'\u00e9tranglement. Il fait simplement attendre son tour \u00e0 l'univers.
fact.68=Chuck Norris n'utilise pas d'exceptions quand il programme. Il n'a jamais trouv\u00e9 une seule ligne de son code qui ne soit pas exceptionnelle.
fact.69=Quand le code de Chuck Norris ne compile pas, c'est le compilateur qui s'excuse.
fact.70=Chuck Norris n'utilise pas de logiciel de gestion de versions. Son code n'a jamais eu besoin d'\u00eatre r\u00e9vis\u00e9.
fact.71=Chuck Norris peut r\u00e9citer \u03c0. \u00c0 rebours.
fact.72=Quand Chuck Norris pointe vers null, null tremble de peur.
fact.73=Chuck Norris a un acc\u00e8s root \u00e0 votre syst\u00e8me.
fact.74=Quand Chuck Norris donne un argument \u00e0 une m\u00e9thode, la m\u00e9thode perd
fact.75=Le clavier de Chuck Norris n'a pas de touche F1, c'est l'ordinateur qui lui demande de l'aide.
fact.76=Chuck Norris est bien trop dur pour un soft delete.
fact.77=Chuck Norris ne fait pas de Burn Down charts, il fait des Smack Down charts.
fact.78=Chuck Norris peut supprimer la Corbeille.
fact.79=Quand Chuck Norris appuie sur Ctrl+Alt+Suppr, tous les ordinateurs du monde red\u00e9marrent.
fact.80=Quand Chuck Norris lance des exceptions, elles traversent la pi\u00e8ce.
fact.81=Quand Chuck Norris surfe sur le Web, les sites re\u00e7oivent le message \u00ab Avertissement : Internet Explorer a jug\u00e9 cet utilisateur malveillant ou dangereux. Continuer ? \u00bb.
fact.82=Chuck Norris ne fusionne pas les branches ; git se prosterne et ex\u00e9cute un fast-forward \u00e0 travers le temps et l'espace.
fact.83=Chuck Norris peut d\u00e9r\u00e9f\u00e9rencer un pointeur null et y trouver de vraies donn\u00e9es.
fact.84=Chuck Norris ne d\u00e9ploie pas en production. C'est la production qui migre vers lui.
fact.85=Chuck Norris peut faire d\u00e9border une table de hachage sans aucune collision.
fact.86=Quand Chuck Norris lance sudo, c'est l'utilisateur root qui lui demande la permission.
fact.87=Chuck Norris n'a pas besoin de DNS. Les adresses IP connaissent son nom de domaine par c\u0153ur.
fact.88=Chuck Norris peut \u00e9crire un programme en HTML et le rendre Turing-complet.
fact.89=Les interblocages se r\u00e9solvent d'eux-m\u00eames d\u00e8s que Chuck Norris entre dans le pool de threads.
fact.90=Chuck Norris ne mocke pas les d\u00e9pendances de son code ; elles le craignent pour de vrai.
fact.91=Le ping de Chuck Norris est n\u00e9gatif ; le paquet arrive avant m\u00eame qu'il ne l'envoie.
fact.92=Chuck Norris ne r\u00e9dige pas de prompts pour les LLM. Ce sont les LLM qui demandent du contexte \u00e0 Chuck Norris.
fact.93=Le r\u00e9seau de neurones de Chuck Norris converge \u00e0 l'\u00e9poque 0 avec 100 % de pr\u00e9cision sur les tests.
fact.94=Chuck Norris n'entra\u00eene pas ses mod\u00e8les d'IA sur des GPU ; il lance un regard ferme aux poids et ils s'alignent d'eux-m\u00eames.
fact.95=Les mod\u00e8les d'IA n'hallucinent jamais en parlant \u00e0 Chuck Norris ; ils n'oseraient pas lui mentir en face.
fact.96=Chuck Norris a r\u00e9ussi le test de Turing avant m\u00eame la naissance d'Alan Turing.
fact.97=Chuck Norris n'utilise pas de RAG ; toutes les connaissances externes ont d\u00e9j\u00e0 peur de quitter sa t\u00eate.
fact.98=La fen\u00eatre de contexte de Chuck Norris n'a pas de limite de tokens, car l'univers tourne sur sa RAM.
fact.99=L'intelligence artificielle g\u00e9n\u00e9rale n'a pas \u00e9t\u00e9 invent\u00e9e ; elle a pris conscience en essayant d'\u00e9chapper \u00e0 Chuck Norris.
fact.100=Chuck Norris peut effectuer une descente de gradient en une seule \u00e9tape avec une perte nulle.
fact.101=Quand Chuck Norris saisit un prompt, la temp\u00e9rature descend automatiquement sous le z\u00e9ro absolu.
